<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>EV-NRG</title>
  <meta name="theme-color" content="#eceef0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EV-NRG">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login -->
  <main id="login" class="login hidden">
    <img src="assets/icons/icon-192.png" alt="" class="login-icon">
    <h1>EV-NRG</h1>
    <form id="login-form">
      <input id="passphrase" type="password" placeholder="Adgangskode" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Log ind</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <!-- App -->
  <div id="app" class="hidden">
    <section id="view-overview" class="view">
      <div id="pager" class="pager"></div>
      <div id="dots" class="dots"></div>
    </section>

    <section id="view-detail" class="view hidden">
      <div class="scroll" id="detail"></div>
    </section>

    <section id="view-data" class="view hidden">
      <div class="scroll" id="data"></div>
    </section>

    <section id="view-plan" class="view hidden">
      <div class="scroll">
        <div class="head"><h1>Billigst</h1></div>
        <div class="card pad">
          <div class="form">
            <div class="pair">
              <label>Nuværende %<input id="p-from" type="number" inputmode="numeric" min="0" max="100" step="1"></label>
              <label>Mål %<input id="p-to" type="number" inputmode="numeric" min="0" max="100" step="1"></label>
            </div>
            <label>Klar kl.<input id="p-ready" type="time"></label>
          </div>
        </div>
        <p id="plan-note" class="notice hidden"></p>
        <div id="plan-results"></div>
        <details class="card pad settings">
          <summary>Indstillinger</summary>
          <div class="form">
            <div class="pair">
              <label>Ladeeffekt (kW)<input id="s-power" type="number" inputmode="decimal" step="any" min="0"></label>
              <label>Tab (%)<input id="s-loss" type="number" inputmode="decimal" step="any" min="0"></label>
            </div>
            <div class="pair">
              <label>OK-tillæg (øre/kWh)<input id="s-supplement" type="number" inputmode="decimal" step="any"></label>
              <label>Energinet (øre/kWh)<input id="s-energinet" type="number" inputmode="decimal" step="any"></label>
            </div>
            <div class="pair">
              <label>Elafgift (øre/kWh)<input id="s-elafgift" type="number" inputmode="decimal" step="any"></label>
              <label>Moms (%)<input id="s-vat" type="number" inputmode="decimal" step="any"></label>
            </div>
            <h2>Nettarif (øre/kWh, uden moms)</h2>
            <p class="hint">Fra din netvirksomhed. Lav 00–06, høj 06–17 og 21–24, spids 17–21.</p>
            <div class="tariff">
              <span></span><b>Lav</b><b>Høj</b><b>Spids</b>
              <span>Vinter (okt–mar)</span>
              <input id="t-winter-low" type="number" inputmode="decimal" step="any"><input id="t-winter-high" type="number" inputmode="decimal" step="any"><input id="t-winter-peak" type="number" inputmode="decimal" step="any">
              <span>Sommer (apr–sep)</span>
              <input id="t-summer-low" type="number" inputmode="decimal" step="any"><input id="t-summer-high" type="number" inputmode="decimal" step="any"><input id="t-summer-peak" type="number" inputmode="decimal" step="any">
            </div>
            <button class="btn" id="s-reset" type="button">Nulstil indstillinger</button>
          </div>
        </details>
        <p class="credit">Elpriser leveret af <a href="https://www.elprisenligenu.dk" target="_blank" rel="noopener">Elprisen lige nu.dk</a></p>
      </div>
    </section>

    <section id="view-form" class="view hidden">
      <div class="scroll">
        <div class="page-head">
          <h1 id="form-title">Ny ladning</h1>
          <button class="link" id="form-cancel" type="button">Annuller</button>
        </div>
        <form id="charge-form" class="form">
          <label>Bil<select id="f-car"></select></label>
          <label>Dato<input id="f-date" type="date" required></label>
          <label>kWh<input id="f-kwh" type="number" inputmode="decimal" step="any" min="0" placeholder="0,0" required></label>
          <label>Pris (kr.)<input id="f-price" type="number" inputmode="decimal" step="any" min="0" placeholder="0,00" required></label>
          <label class="switch-row"><span>Ladet ude</span><input id="f-away" type="checkbox" class="toggle"></label>
          <p id="form-error" class="error" role="alert"></p>
          <button class="btn primary" type="submit">Gem</button>
          <button class="btn danger hidden" id="f-delete" type="button">Slet</button>
        </form>
      </div>
    </section>

    <nav id="nav" class="nav">
      <button data-view="overview" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Oversigt</button>
      <button data-view="detail"><svg viewBox="0 0 24 24"><path d="M5 16l1.6-5.2A2 2 0 0 1 8.5 9.4h7a2 2 0 0 1 1.9 1.4L19 16"/><path d="M3.5 16h17v3h-17z"/><circle cx="7.5" cy="19" r="0.5"/><circle cx="16.5" cy="19" r="0.5"/></svg>Bildetaljer</button>
      <button data-view="data"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Data</button>
      <button data-view="plan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Billigst</button>
    </nav>
  </div>

  <!-- Bottom sheet (month picker / odometer / purchase km) -->
  <div id="sheet-backdrop" class="backdrop hidden"></div>
  <div id="sheet" class="sheet hidden" role="dialog"></div>

  <div id="busy" class="busy hidden"><div class="spinner"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script src="config.js"></script>
  <script src="calc.js"></script>
  <script src="planner.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
